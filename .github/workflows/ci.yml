name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every folder with a package.json is an example: a new one is tested without touching this file.
  list:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.find.outputs.examples }}
      agents: ${{ steps.find.outputs.agents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: find
        run: |
          echo "examples=$(ls -d */package.json | xargs -n1 dirname | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "agents=$(ls -d */requirements.txt | xargs -n1 dirname | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  example:
    needs: list
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.list.outputs.examples) }}
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.example }}/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Every folder with a requirements.txt holds a Python agent: it is installed and run, with its scripted model.
  agent:
    needs: list
    name: ${{ matrix.example }} (agent)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.list.outputs.agents) }}
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ matrix.example }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: python smoke_test.py

  # The one check main requires: it passes when every example does, however many there are.
  all:
    name: all examples
    if: always()
    needs: [list, example, agent]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.list.result }}" = success && test "${{ needs.example.result }}" = success && test "${{ needs.agent.result }}" = success
